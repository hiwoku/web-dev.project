<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="logo">EduFinder</a>

    <div class="nav-search">
      <input 
        [(ngModel)]="searchQuery" 
        (keyup.enter)="onSearch()" 
        placeholder="Search courses..." 
      />
      <button (click)="onSearch()" aria-label="Search">🔍</button>
    </div>

    <div class="nav-right-group">
      <div class="nav-links">
        <a routerLink="/courses" routerLinkActive="active">Courses</a>
        <a routerLink="/companies" routerLinkActive="active">Companies</a>
      </div>

      <div class="nav-auth">
        @if (auth.isLoggedIn()) {
          <div class="user-info">
            <a routerLink="/profile" class="nav-profile">
              <span class="user-icon">👤</span> {{ auth.username() }}
            </a>
            <button (click)="logout()" class="btn-logout">Logout</button>
          </div>
        } @else {
          <a routerLink="/login" class="btn-login">Log In</a>
          <a routerLink="/register" class="btn-register">Register</a>
        }
      </div>
    </div>
  </div>
  <style>
    .navbar {
  width: 100%;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
  padding: 0.75rem 0;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.logo {
  font-size: 1.5rem;
  font-weight: 800;
  color: #4f46e5;
  text-decoration: none;
  letter-spacing: -0.5px;
}

.nav-search {
  flex: 1;
  max-width: 600px;
  position: relative;
  display: flex;
}

.nav-search input {
  width: 100%;
  padding: 10px 45px 10px 15px;
  border: 1px solid #d1d5db;
  border-radius: 17px;
  font-size: 0.95rem;
  transition: all 0.2s;
}

.nav-search input:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
  outline: none;
}

.nav-search button {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
}

.nav-right-group {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.nav-links {
  display: flex;
  gap: 1.5rem;
}

.nav-links a {
  text-decoration: none;
  color: #374151;
  font-weight: 500;
  transition: color 0.2s;
}

.nav-links a:hover, .nav-links a.active {
  color: #4f46e5;
}

.nav-auth {
  display: flex;
  gap: 1rem;
  align-items: center;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-profile {
  text-decoration: none;
  color: #111827;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
}

.btn-login {
  color: #4f46e5;
  text-decoration: none;
  font-weight: 600;
}

.btn-register {
  background: #4f46e5;
  color: white;
  padding: 8px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  transition: background 0.2s;
}

.btn-register:hover {
  background: #4338ca;
}

.btn-logout {
  background: #f3f4f6;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: #ef4444;
  font-weight: 500;
}
  </style>
</nav>

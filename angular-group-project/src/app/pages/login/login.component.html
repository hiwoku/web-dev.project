<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-mark">EF</div>
      <h1>Welcome back</h1>
      <p>Log in to your EduFinder account</p>
    </div>

    @if (error()) {
      <div class="error-alert"> {{ error() }}</div>
    }

    <div class="form-group">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        placeholder="Enter your username"
        class="form-input"
        (keyup.enter)="onSubmit()"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        class="form-input"
        (keyup.enter)="onSubmit()"
      />
    </div>

    <button
      class="submit-btn"
      (click)="onSubmit()"
      [disabled]="isLoading()"
    >
      {{ isLoading() ? 'Logging in...' : 'Login' }}
    </button>

    <p class="register-link">
      Don't have an account? <a routerLink="/home">Contact admin to register</a>
    </p>
  </div>
</div>

<style>

    background: #fff;

  }

    font-weight: 800;

    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .login-header h1 { font-size: 1.6rem; font-weight: 700; color: #1F2937; margin: 0 0 8px; }
  .login-header p { color: #6B7280; margin: 0; }
  .error-alert {
    background: #FEF2F2;
    color: #DC2626;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.9rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
  .form-input {

</style>

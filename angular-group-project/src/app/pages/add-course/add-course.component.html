<div class="add-course-page">
  <h1>Add New Course</h1>
  @if (error) { <p class="error">{{ error }}</p> }

  <input [(ngModel)]="title" placeholder="Course Title" />
  <textarea [(ngModel)]="description" placeholder="Full Description"></textarea>
  <input [(ngModel)]="shortDescription" placeholder="Short Description (shown on hover)" />

  <select [(ngModel)]="selectedCompany">
    <option value="">Select Company</option>
    @for (c of companies; track c.id) { <option [value]="c.id">{{ c.name }}</option> }
  </select>

  <select [(ngModel)]="selectedCategory">
    <option value="">Select Category</option>
    @for (cat of categories; track cat.id) { <option [value]="cat.id">{{ cat.name }}</option> }
  </select>

  <select [(ngModel)]="level">
    <option value="beginner">Beginner</option>
    <option value="intermediate">Intermediate</option>
    <option value="advanced">Advanced</option>
  </select>

  <label>
    <input type="checkbox" [(ngModel)]="isFree" /> Free Course
  </label>
  @if (!isFree) {
    <input [(ngModel)]="price" type="number" placeholder="Price ($)" />
  }

  <input [(ngModel)]="skills" placeholder="Skills (comma separated): Python, SQL, ML" />

  <button (click)="submit()" class="btn-primary">Publish Course</button>
</div>
